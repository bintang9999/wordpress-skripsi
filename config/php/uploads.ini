; ==============================================================================
; uploads.ini - Konfigurasi PHP untuk WordPress pada server RAM kecil
; Container mem_limit=768m, PHP memory_limit=256M
; ==============================================================================

[PHP]
; --- Upload ---
upload_max_filesize = 64M
post_max_size       = 64M
max_execution_time  = 120
max_input_time      = 120
; Penting untuk plugin yang mengirim banyak field (Elementor, dsb)
max_input_vars      = 3000
memory_limit        = 256M

; --- OPcache: bytecode caching, percepat PHP signifikan ---
; Diaktifkan untuk performa; turunkan memory_consumption jika RAM mepet
opcache.enable                 = 1
opcache.memory_consumption     = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files  = 4000
; Interval pengecekan perubahan file (detik); naikkan di production
opcache.revalidate_freq        = 60
opcache.fast_shutdown          = 1
opcache.enable_cli             = 0
opcache.validate_timestamps    = 1

; --- Error Handling ---
; Matikan display_errors di production (keamanan)
display_errors  = Off
log_errors      = On
error_log       = /var/log/php_errors.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

