# ==============================================================================
# portal-kampus.conf - Nginx Reverse Proxy Snippet (ADDITIVE)
#
# PENTING: File ini HANYA DITAMBAHKAN ke Nginx yang sudah ada.
#          JANGAN timpa nginx.conf atau konfigurasi yang sudah berjalan!
#
# CARA MENGAKTIFKAN (di server):
#   sudo cp ~/portal-kampus/config/nginx/portal-kampus.conf /etc/nginx/conf.d/
#   sudo nginx -t
#   sudo nginx -s reload
#
# Ini membuka port 8084 di nginx sebagai proxy ke WordPress di 8083.
# Akses: http://192.168.0.108:8084  atau  http://100.110.184.29:8084
# (WordPress juga tetap bisa diakses langsung via :8083)
# ==============================================================================

server {
    listen 8084;
    listen [::]:8084;

    server_name portal.kampus.local 192.168.0.108 100.110.184.29;

    # Batas ukuran upload (harus sama dengan PHP post_max_size)
    client_max_body_size 64M;

    # Timeout
    proxy_connect_timeout 60s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # Gzip untuk mempercepat transfer
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/javascript application/json
        application/javascript application/x-javascript
        application/xml application/rss+xml image/svg+xml;

    location / {
        proxy_pass         http://127.0.0.1:8083;
        proxy_http_version 1.1;

        # Header standar reverse proxy
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (jika ada plugin yang butuh)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Buffer
        proxy_buffering    on;
        proxy_buffer_size  128k;
        proxy_buffers      4 256k;
    }
}
